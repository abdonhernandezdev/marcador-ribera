<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="assets/icono-64.png" />
<title>Marcador · AD Voleibol Ribera</title>
<style>
  @font-face { font-family: 'BSC'; src: url('assets/fonts/barlow-sc-black.woff2') format('woff2'); font-weight: 900; font-display: block; }
  @font-face { font-family: 'Mont'; src: url('assets/fonts/montserrat.woff2') format('woff2'); font-weight: 100 900; font-display: block; }
  :root { --red: #e3161e; --red2: #b0111a; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100%; height: 100%; }
  body.checker { background: repeating-conic-gradient(#3a3a40 0 25%, #2c2c31 0 50%) 0 0 / 40px 40px; }

  /* everything is drawn at 600 px wide and scaled to the widget (see layout()) */
  #stage { position: absolute; left: 0; top: 0; width: 600px; transform-origin: 0 0; }
  #board { position: relative; width: 600px; filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.5));
           transition: transform 0.6s cubic-bezier(.2, .9, .25, 1), opacity 0.45s ease; }
  #board.hidden { transform: translateX(-115%); opacity: 0; }
  body.right #board.hidden { transform: translateX(115%); }

  .head { display: flex; height: 32px; align-items: stretch; }
  .settag { position: relative; z-index: 2; display: flex; align-items: center; padding: 0 22px 0 16px; margin-right: -12px;
            background: var(--red); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }
  .settag span { font: 900 21px/1 'BSC'; letter-spacing: 0.07em; color: #fff; }
  .label { flex: 1; display: flex; align-items: center; padding-left: 26px; background: rgba(9, 9, 12, 0.93);
           font: 600 12.5px/1 'Mont'; letter-spacing: 0.22em; color: rgba(255, 255, 255, 0.86); white-space: nowrap; overflow: hidden;
           clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); }

  .rows { background: linear-gradient(180deg, rgba(28, 28, 33, 0.96), rgba(11, 11, 14, 0.96)); border-radius: 0 0 6px 6px; overflow: hidden; }
  .row { display: flex; height: 58px; align-items: stretch; }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .chip { width: 8px; flex: none; }
  .crest { width: 58px; flex: none; display: flex; align-items: center; justify-content: center; }
  .crest img { max-width: 44px; max-height: 42px; display: block; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); }
  .row.nocrest .crest { display: none; }
  .name { flex: 1; display: flex; align-items: center; padding-left: 4px; font: 900 34px/1 'BSC'; letter-spacing: 0.02em;
          color: #fff; white-space: nowrap; overflow: hidden; }
  .row.nocrest .name { padding-left: 18px; }
  .serve { width: 40px; flex: none; display: flex; align-items: center; justify-content: center; }
  .serve svg { width: 24px; height: 24px; opacity: 0; transform: scale(0.4) rotate(-90deg);
               transition: opacity 0.3s ease, transform 0.45s cubic-bezier(.2, 1.4, .4, 1); }
  .row.serving .serve svg { opacity: 1; transform: none; }
  .sets { width: 56px; flex: none; display: flex; align-items: center; justify-content: center; background: #2a2a31;
          font: 900 30px/1 'BSC'; color: #fff; }
  .pts { position: relative; width: 88px; flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden;
         background: linear-gradient(180deg, #ec1f28, var(--red2)); font: 900 42px/1 'BSC'; color: #fff; font-variant-numeric: tabular-nums; }
  .pts::after { content: ''; position: absolute; inset: 0; background: #fff; opacity: 0; }
  .pts.bump::after { animation: flash 0.5s ease-out; }
  .pts span, .sets span { display: inline-block; }
  .pts.bump span, .sets.bump span { animation: bump 0.45s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes flash { 0% { opacity: 0.55; } 100% { opacity: 0; } }
  @keyframes bump { 0% { transform: translateY(45%) scale(0.7); opacity: 0; } 100% { transform: none; opacity: 1; } }

  .partials { display: flex; gap: 2px; margin-top: 4px; overflow: hidden; max-height: 0; transition: max-height 0.4s ease; }
  .partials.on { max-height: 40px; }
  .partials div { background: rgba(9, 9, 12, 0.92); padding: 7px 12px; font: 600 12.5px/1 'Mont'; letter-spacing: 0.12em; color: rgba(255, 255, 255, 0.8); }
  .partials b { font: 900 15px/1 'BSC'; letter-spacing: 0.04em; color: #fff; margin-left: 6px; }
  .partials b i { font-style: normal; color: rgba(255, 255, 255, 0.45); }

  #tag { position: absolute; left: 0; top: 100%; margin-top: 6px; padding: 7px 18px 7px 14px; font: 900 18px/1 'BSC'; letter-spacing: 0.08em;
         white-space: nowrap; clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transform-origin: 0 0; overflow: hidden;
         transition: opacity 0.3s ease, transform 0.4s cubic-bezier(.2, 1.3, .4, 1); opacity: 0; transform: translateY(-8px) scaleY(0.6); }
  #tag.on { opacity: 1; transform: none; }
  #tag.red { background: var(--red); color: #fff; }
  #tag.white { background: #fff; color: var(--red); }
  #tag.dark { background: rgba(9, 9, 12, 0.93); color: #fff; }
  #tag.pulse { animation: pulse 1.1s ease-in-out infinite; }
  #tag .bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--red); transform-origin: 0 0; display: none; }
  #tag.timing .bar { display: block; }
  @keyframes pulse { 50% { filter: brightness(1.28); } }
  @keyframes drain { from { transform: scaleX(var(--from, 1)); } to { transform: scaleX(0); } }
  body.right #tag { left: auto; right: 0; }

  #debug { position: fixed; right: 8px; bottom: 8px; font: 600 12px 'Mont', sans-serif; color: #fff; background: rgba(0, 0, 0, 0.6); padding: 6px 10px; border-radius: 6px; display: none; }
  body.debug #debug { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="board" class="hidden">
    <div class="head">
      <div class="settag"><span id="setlabel">SET 1</span></div>
      <div class="label" id="label">SENIOR MASCULINO · JORNADA 1</div>
    </div>
    <div class="rows">
      <div class="row" id="row0">
        <div class="chip"></div><div class="crest"><img alt="" /></div><div class="name"><span>RIBERA</span></div>
        <div class="serve"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.6" fill="#fff" stroke="#0d0d10" stroke-width="1.1"/><path d="M12 1.6c-1.4 3.6-1.1 7.2.7 10.4M12.7 12c3.7.9 7.1.4 10-1.5M12.7 12c-2.3 3-5.6 4.8-9.8 5.4" fill="none" stroke="#e3161e" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <div class="sets"><span>0</span></div><div class="pts"><span>0</span></div>
      </div>
      <div class="row" id="row1">
        <div class="chip"></div><div class="crest"><img alt="" /></div><div class="name"><span>A7</span></div>
        <div class="serve"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.6" fill="#fff" stroke="#0d0d10" stroke-width="1.1"/><path d="M12 1.6c-1.4 3.6-1.1 7.2.7 10.4M12.7 12c3.7.9 7.1.4 10-1.5M12.7 12c-2.3 3-5.6 4.8-9.8 5.4" fill="none" stroke="#e3161e" stroke-width="1.7" stroke-linecap="round"/></svg></div>
        <div class="sets"><span>0</span></div><div class="pts"><span>0</span></div>
      </div>
    </div>
    <div class="partials" id="partials"></div>
    <div id="tag"><span class="txt"></span><i class="bar"></i></div>
  </div>
</div>
<div id="debug"></div>

<script src="assets/mqtt.min.js"></script>
<script src="assets/rules.js"></script>
<script src="assets/sync.js"></script>
<script>
(function () {
  'use strict';
  const q = new URLSearchParams(location.search);
  const KEY = 'rb-marcador-overlay-' + Sync.channel();
  const $ = (s) => document.querySelector(s);
  const DESIGN_W = 600;
  const DESIGN_H = 226;   // head + rows + set partials + tag below, so nothing is cut off
  const PAD = 10;         // room for the shadow
  let state = null;

  if (q.has('fondo')) document.body.classList.add('checker');
  if (q.has('debug')) document.body.classList.add('debug');
  const pos = (q.get('pos') || 'tl').toLowerCase();
  if (pos.includes('r')) document.body.classList.add('right');

  /* Default: the scoreboard fills the widget, so in PRISM you place it by dragging and
     pinching the widget box. ?pantalla=1: the page is the whole video frame and the board
     sits in a corner (?pos=tl|tr|bl|br, ?escala=1.2), handy for OBS or PRISM on a computer. */
  function layout() {
    const W = window.innerWidth, H = window.innerHeight;
    if (!W || !H) return;
    const stage = $('#stage');
    let scale, x, y;
    if (q.get('pantalla') === '1') {
      const mult = parseFloat(q.get('escala') || '1') || 1;
      scale = ((W >= H ? 0.3 : 0.62) * W * mult) / DESIGN_W;
      const m = 0.025 * Math.min(W, H * 16 / 9);
      x = pos.includes('r') ? W - DESIGN_W * scale - m : m;
      y = pos.includes('b') ? H - DESIGN_H * scale - m : m;
    } else {
      scale = Math.min(W / (DESIGN_W + 2 * PAD), H / (DESIGN_H + 2 * PAD));
      x = pos.includes('r') ? W - (DESIGN_W + PAD) * scale : PAD * scale;
      y = PAD * scale;
    }
    stage.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  }
  window.addEventListener('resize', layout);

  function fitName(el) {
    const span = el.querySelector('span');
    let size = 34;
    el.style.fontSize = size + 'px';
    while (span.offsetWidth > el.clientWidth - 16 && size > 18) {
      size -= 1;
      el.style.fontSize = size + 'px';
    }
  }

  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function setNum(box, value) {
    const span = box.querySelector('span');
    if (span.textContent !== String(value)) {
      span.textContent = value;
      bump(box);
    }
  }

  function setCrest(row, crest) {
    const img = row.querySelector('.crest img');
    if (!crest) { row.classList.add('nocrest'); img.removeAttribute('src'); return; }
    const src = 'assets/escudos/' + crest + '.png';
    if (img.getAttribute('src') !== src) {
      row.classList.remove('nocrest');
      img.onerror = () => { row.classList.add('nocrest'); fitName(row.querySelector('.name')); };
      img.setAttribute('src', src);
    }
  }

  const teamName = (s, i) => (i === 0 ? s.home : s.away).name;

  function renderTag(s) {
    const tag = $('#tag');
    const txt = tag.querySelector('.txt');
    let text = '', cls = '';
    const w = Rules.setWinner(s);
    const p = Rules.pressure(s);
    const left = s.timeoutUntil - Date.now();
    const timeout = s.timeout >= 0 && left > 0;
    if (s.finished) { const win = s.sets[0] > s.sets[1] ? 0 : 1; text = 'GANA ' + teamName(s, win) + ' ' + s.sets[win] + '-' + s.sets[1 - win]; cls = 'red'; }
    else if (w >= 0) { text = 'SET PARA ' + teamName(s, w); cls = 'red'; }
    else if (timeout) { text = 'TIEMPO MUERTO · ' + teamName(s, s.timeout); cls = 'dark timing'; }
    else if (p) { text = (p.kind === 'match' ? 'PUNTO DE PARTIDO · ' : 'PUNTO DE SET · ') + teamName(s, p.team); cls = p.kind === 'match' ? 'red pulse' : 'white'; }
    if (text) {
      if (txt.textContent !== text) txt.textContent = text;
      tag.className = 'on ' + cls;
      const bar = tag.querySelector('.bar');
      const key = timeout ? s.timeout + ':' + s.timeoutUntil : '';
      if (timeout && bar.dataset.key !== key) {
        // countdown bar for the 30 s timeout
        bar.dataset.key = key;
        bar.style.animation = 'none';
        void bar.offsetWidth;
        bar.style.setProperty('--from', Math.min(1, left / 30000).toFixed(3));
        bar.style.animation = `drain ${left}ms linear forwards`;
      }
    } else {
      tag.className = '';
    }
  }

  function render(s) {
    $('#setlabel').textContent = s.finished ? 'FINAL' : (Rules.isTieBreak(s) ? 'TIE-BREAK' : 'SET ' + s.set);
    $('#label').textContent = s.label || '';
    [s.home, s.away].forEach((t, i) => {
      const row = $('#row' + i);
      row.querySelector('.chip').style.background = t.color;
      setCrest(row, t.crest);
      const nameEl = row.querySelector('.name');
      if (nameEl.querySelector('span').textContent !== t.name) nameEl.querySelector('span').textContent = t.name;
      fitName(nameEl);
      row.classList.toggle('serving', !s.finished && s.serve === i);
      setNum(row.querySelector('.sets'), s.sets[i]);
      setNum(row.querySelector('.pts'), s.points[i]);
    });
    const parts = $('#partials');
    const html = s.partials
      .map((p, i) => `<div>SET ${i + 1}<b>${p[0]}<i>-</i>${p[1]}</b></div>`)
      .join('');
    if (parts.innerHTML !== html) parts.innerHTML = html;
    parts.classList.toggle('on', (!!s.showPartials || s.finished) && s.partials.length > 0);
    $('#board').classList.toggle('hidden', !s.show);
    renderTag(s);
    layout();
  }

  function apply(s, save) {
    if (!s || !Rules.isNewer(s, state, Date.now())) return;
    state = s;
    render(s);
    if (save) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
  }

  // last known state first (the widget may reload mid-match), then live updates
  const demo = q.get('demo') === '1';
  if (!demo) { try { apply(Rules.sanitize(JSON.parse(localStorage.getItem(KEY) || 'null')), false); } catch (e) {} }
  if (!state) apply(Object.assign(Rules.defaults(), { ts: 1 }), false);
  setInterval(() => state && renderTag(state), 500);
  if (document.fonts) document.fonts.ready.then(() => state && render(state));

  if (demo) {
    // a match that plays itself, for the preview on the home page
    let s = Object.assign(Rules.defaults(), { ts: 2, set: 2, sets: [1, 0], partials: [[25, 21]], points: [17, 15], serve: 0, firstServe: 1, showPartials: true });
    let hold = 0;
    apply(s, false);
    setInterval(() => {
      if (hold > 0) { hold -= 1; return; }
      if (s.finished) { s = Object.assign(Rules.defaults(), { set: 1, showPartials: true }); }
      else if (Rules.setWinner(s) >= 0) { s = Rules.closeSet(s); if (s.finished) hold = 5; }
      else { s = Rules.point(s, Math.random() < 0.56 ? 0 : 1, 1); if (Rules.setWinner(s) >= 0) hold = 2; }
      s = Rules.stamp(s, state, Date.now());
      apply(s, false);
    }, 1500);
    return;
  }

  if (window.mqtt) {
    window.__link = Sync.connect({
      onState: (s) => apply(s, true),
      onStatus: (list) => { $('#debug').textContent = Sync.channel() + ' · ' + list.map((l) => l.name + (l.ok ? ' ✓' : ' ✗')).join('  '); },
    });
  }
})();
</script>
</body>
</html>
